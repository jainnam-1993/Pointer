# Settings Screen Flow - User preferences and notifications
# Run: maestro test maestro/flows/05_settings.yaml
#
# Tests: Settings navigation, notification access, developer unlock (7-tap easter egg)

appId: com.dailypointer
---
- launchApp:
    clearState: true

# Complete onboarding
- runFlow: ../shared/skip_onboarding.yaml

# Navigate to settings
- tapOn:
    text: "Settings tab.*"

# === INITIAL SETTINGS VIEW ===
- assertVisible:
    text: "Settings"
- takeScreenshot: "settings_01_initial"

# === SCROLL DOWN TO REVEAL MORE OPTIONS ===
- swipe:
    direction: DOWN
- takeScreenshot: "settings_02_scrolled"

# === NOTIFICATION SETTINGS ===
- tapOn:
    text: ".*Notification.*"
- takeScreenshot: "settings_03_notifications"

# Go back to settings
- back
- waitForAnimationToEnd

# === SCROLL MORE FOR ABOUT SECTION ===
- swipe:
    direction: DOWN
- takeScreenshot: "settings_04_about"

# === DEVELOPER MENU UNLOCK (7-tap easter egg) ===
- tapOn:
    text: ".*Pointer v.*"
- tapOn:
    text: ".*Pointer v.*"
- tapOn:
    text: ".*Pointer v.*"
- tapOn:
    text: ".*Pointer v.*"
- tapOn:
    text: ".*Pointer v.*"
- tapOn:
    text: ".*Pointer v.*"
- tapOn:
    text: ".*Pointer v.*"
- takeScreenshot: "settings_05_developer_unlocked"

# === BACK TO HOME ===
- tapOn:
    text: "Home tab.*"
- assertVisible:
    text: ".*Next.*"
- takeScreenshot: "settings_06_back_home"
