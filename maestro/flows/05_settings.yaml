# Settings Screen Flow - User preferences and notifications
# Run: maestro test maestro/flows/05_settings.yaml
#
# Tests: Settings navigation, theme options, developer unlock (7-tap easter egg)

appId: com.dailypointer
---
- launchApp:
    clearState: true

# Complete onboarding
- runFlow: ../shared/skip_onboarding.yaml

# Navigate to settings
- tapOn:
    text: "Settings tab.*"

# === INITIAL SETTINGS VIEW ===
- assertVisible:
    text: "Settings"
- takeScreenshot: "settings_01_initial"

# === SCROLL DOWN TO REVEAL ABOUT SECTION ===
- swipe:
    direction: UP
    duration: 400
- swipe:
    direction: UP
    duration: 400
- swipe:
    direction: UP
    duration: 400
- takeScreenshot: "settings_02_scrolled"

# === DEVELOPER MENU UNLOCK (7-tap easter egg) ===
- tapOn:
    text: ".*Here Now v.*"
- tapOn:
    text: ".*Here Now v.*"
- tapOn:
    text: ".*Here Now v.*"
- tapOn:
    text: ".*Here Now v.*"
- tapOn:
    text: ".*Here Now v.*"
- tapOn:
    text: ".*Here Now v.*"
- tapOn:
    text: ".*Here Now v.*"
- takeScreenshot: "settings_03_developer_unlocked"

# === BACK TO HOME ===
- tapOn:
    text: "Home tab.*"
- assertVisible:
    text: ".*Next.*"
- takeScreenshot: "settings_04_back_home"
