# Screenshot Capture Flow - App Store & Documentation
# Run: maestro test maestro/flows/06_screenshots_all.yaml
#
# Purpose: Generate consistent screenshots for both platforms
# Output: maestro/screenshots/ directory
# Replaces: scripts/screenshot_test.sh, integration_test/screenshot_test.dart (for this use case)

appId: com.dailypointer
---
- launchApp:
    clearState: true

# === ONBOARDING SCREENSHOTS ===
- waitForAnimationToEnd
- tapOn:
    point: "50%,50%"
- tapOn:
    point: "50%,50%"
- extendedWaitUntil:
    visible:
      text: "Continue"
    timeout: 10000
- takeScreenshot: "maestro/screenshots/store_01_onboarding"

# Complete onboarding
- tapOn:
    text: "Continue"
- waitForAnimationToEnd
- tapOn:
    text: "Continue"
- waitForAnimationToEnd
- tapOn:
    text: "Continue"
- waitForAnimationToEnd
- tapOn:
    text: "Maybe Later"
    optional: true
- waitForAnimationToEnd

# === HOME SCREEN SCREENSHOTS ===
- tapOn:
    text: "Home tab.*"
- takeScreenshot: "maestro/screenshots/store_02_home"

# Show pointer content
- tapOn:
    text: ".*Next.*"
    optional: true
- takeScreenshot: "maestro/screenshots/store_03_home_pointing"

# === INQUIRY SCREEN ===
- tapOn:
    text: "Inquiry tab.*"
- takeScreenshot: "maestro/screenshots/store_04_inquiry"

# === LIBRARY SCREEN ===
- tapOn:
    text: "Library tab.*"
- takeScreenshot: "maestro/screenshots/store_05_library"

# === SETTINGS SCREEN ===
- tapOn:
    text: "Settings tab.*"
- takeScreenshot: "maestro/screenshots/store_06_settings"

# Scroll for more settings
- swipe:
    direction: DOWN
- takeScreenshot: "maestro/screenshots/store_07_settings_more"

# === BACK TO HOME - FINAL STATE ===
- tapOn:
    text: "Home tab.*"
- takeScreenshot: "maestro/screenshots/store_08_final"
