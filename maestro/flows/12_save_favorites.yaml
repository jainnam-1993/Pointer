# Save Favorites Flow - Long-press to save pointing
# Run: maestro test maestro/flows/12_save_favorites.yaml
#
# Tests: Long-press save gesture, first-save celebration, save confirmation
# Save confirmation shows "Saved" (normal) or "First Save!" (first time)
# Note: Favorites sync to home widget tested in 16_widget_interactions.yaml

appId: com.dailypointer
---
- launchApp:
    clearState: true

# Complete onboarding
- runFlow: ../shared/skip_onboarding.yaml

# Go to home tab
- tapOn:
    text: "Home tab.*"

# === INITIAL STATE ===
- assertVisible:
    text: ".*Next.*"
- takeScreenshot: "favorites_01_initial"

# === FIRST SAVE (triggers first-save celebration) ===
# Long-press on the pointing card to save
- longPressOn:
    point: "50%,40%"
# Save confirmation auto-dismisses after 2-3s — catch it quickly
# Save confirmation (2s auto-dismiss) not in accessibility tree — wait it out
- waitForAnimationToEnd
- takeScreenshot: "favorites_02_first_save"

# Wait for auto-dismiss
- waitForAnimationToEnd

# === NAVIGATE TO NEW POINTING ===
- tapOn:
    text: ".*Next.*"
- assertVisible:
    text: ".*Next.*"
- takeScreenshot: "favorites_03_new_pointing"

# === SAVE SECOND POINTING ===
- longPressOn:
    point: "50%,40%"
# Save confirmation (2s auto-dismiss) not in accessibility tree — wait it out
- waitForAnimationToEnd
- takeScreenshot: "favorites_04_second_save"

# Wait for auto-dismiss
- waitForAnimationToEnd

# === UNSAVE (toggle off) ===
# Long-press again on same pointing should unsave it
- longPressOn:
    point: "50%,40%"
- takeScreenshot: "favorites_05_unsaved"

# === VERIFY FINAL STATE ===
- tapOn:
    text: "Home tab.*"
- assertVisible:
    text: ".*Next.*"
- takeScreenshot: "favorites_06_complete"
