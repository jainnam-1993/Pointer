# Save Favorites Flow - Long-press to save pointing
# Run: maestro test maestro/flows/12_save_favorites.yaml
#
# Tests: Long-press save gesture, save confirmation overlay
# Note: Favorites sync to home widget tested in 16_widget_interactions.yaml

appId: com.dailypointer
---
- launchApp:
    clearState: true

# Complete onboarding
- runFlow: ../shared/skip_onboarding.yaml

# Go to home tab
- tapOn:
    text: "Home tab.*"

# === INITIAL STATE ===
- assertVisible:
    text: "Save to favorites"
- takeScreenshot: "maestro/screenshots/favorites_01_initial"

# === FIRST SAVE ===
# Tap heart to save current pointing
- tapOn:
    text: "Save to favorites"
- extendedWaitUntil:
    visible:
      text: "Remove from favorites"
    timeout: 5000
- takeScreenshot: "maestro/screenshots/favorites_02_first_save"

# === SAVE CONFIRMATION ===
# Filled heart state should persist after save
- takeScreenshot: "maestro/screenshots/favorites_03_confirmation"

# === NAVIGATE TO NEW POINTING ===
- tapOn:
    text: ".*Next.*"
    optional: true
- tapOn:
    point: "50%,75%"
    optional: true
- takeScreenshot: "maestro/screenshots/favorites_04_new_pointing"

# === SAVE SECOND POINTING ===
- tapOn:
    text: "Save to favorites"
- extendedWaitUntil:
    visible:
      text: "Remove from favorites"
    timeout: 5000
- takeScreenshot: "maestro/screenshots/favorites_05_second_save"

# === UNSAVE (toggle off) ===
- tapOn:
    text: "Remove from favorites"
- extendedWaitUntil:
    visible:
      text: "Save to favorites"
    timeout: 5000
- takeScreenshot: "maestro/screenshots/favorites_06_unsaved"

# === VERIFY FINAL STATE ===
- tapOn:
    text: "Home tab.*"
- assertVisible:
    text: "Save to favorites"
- takeScreenshot: "maestro/screenshots/favorites_07_complete"
