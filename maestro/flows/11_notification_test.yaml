# Notification Scheduling Test Flow
# Run: maestro test maestro/flows/11_notification_test.yaml
#
# Purpose: Enable 1-minute notification scheduling to verify notification delivery
# Tests: Developer unlock, notification enable, test preset selection
#
# IMPORTANT: After running this flow, wait 1-2 minutes and verify notifications
# arrive on the device. This flow sets up scheduling but cannot verify delivery.

appId: com.dailypointer
---
- launchApp:
    clearState: true  # Start fresh to ensure clean notification state

# === HANDLE ONBOARDING ===
- runFlow: ../shared/skip_onboarding.yaml
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Maybe Later"
    optional: true

# === NAVIGATE TO SETTINGS ===
- tapOn:
    text: "Settings tab.*"
- takeScreenshot: "maestro/screenshots/notif_01_settings_initial"

# === UNLOCK DEVELOPER OPTIONS (7 taps on version) ===
- scrollUntilVisible:
    element:
      text: ".*Here Now v.*"
    direction: DOWN
    timeout: 10000
- tapOn:
    text: ".*Here Now v.*"
- tapOn:
    text: ".*Here Now v.*"
- tapOn:
    text: ".*Here Now v.*"
- tapOn:
    text: ".*Here Now v.*"
- tapOn:
    text: ".*Here Now v.*"
- tapOn:
    text: ".*Here Now v.*"
- tapOn:
    text: ".*Here Now v.*"
- takeScreenshot: "maestro/screenshots/notif_02_developer_unlocked"

# === GRANT ALARM PERMISSION (if needed) ===
- tapOn:
    text: ".*Grant Alarm Permission.*"
    optional: true
- extendedWaitUntil:
    visible: ".*Settings.*"
    timeout: 5000

# === SCROLL UP TO FIND NOTIFICATIONS SECTION ===
- scrollUntilVisible:
    element:
      text: ".*Notification.*"
    direction: UP
    timeout: 10000

# === ENABLE NOTIFICATIONS ===
- tapOn:
    text: ".*Notification.*"
- takeScreenshot: "maestro/screenshots/notif_03_notification_sheet"

# === SELECT TEST PRESET (every 1 minute) ===
- tapOn:
    text: ".*Test.*"
    optional: true
- takeScreenshot: "maestro/screenshots/notif_04_test_preset_selected"

# === CONFIRM/SAVE SCHEDULE ===
- tapOn:
    text: ".*Save.*"
    optional: true
- tapOn:
    text: ".*Done.*"
    optional: true

# === VERIFY SCHEDULE IS ACTIVE ===
- scroll
- takeScreenshot: "maestro/screenshots/notif_05_schedule_saved"

# === SEND IMMEDIATE TEST NOTIFICATION ===
- tapOn:
    text: ".*Test Notification.*"
    optional: true
- tapOn:
    text: ".*Send Test.*"
    optional: true
- takeScreenshot: "maestro/screenshots/notif_06_test_sent"

# === BACKGROUND THE APP ===
- pressKey: Home
- takeScreenshot: "maestro/screenshots/notif_07_backgrounded"

# === INSTRUCTIONS FOR MANUAL VERIFICATION ===
#
# After this flow completes:
# 1. Wait 1-2 minutes
# 2. Check if notifications arrive in the notification shade
# 3. If notifications DON'T arrive:
#    - Check "Alarms & reminders" permission in Android Settings
#    - Check notification channel is enabled
#    - Check Android battery optimization isn't killing the app
