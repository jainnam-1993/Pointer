# Library Content Flow - Browse articles and teachings
# Run: maestro test maestro/flows/09_library_content.yaml
#
# Tests: Library navigation, featured articles, category browsing, article reader
# All content is free (kFreeAccessEnabled=TRUE)
#
# Zero optional assertions — every step must pass or the flow fails.

appId: com.dailypointer
---
- launchApp:
    clearState: true
- waitForAnimationToEnd

# Complete onboarding
- runFlow: ../shared/skip_onboarding.yaml

# Navigate to Library tab
- tapOn:
    text: "Library tab.*"
- waitForAnimationToEnd

# === LIBRARY HEADER ===
- assertVisible:
    text: "Library"
- assertVisible:
    text: ".*Explore teachings.*"

# === FEATURED SECTION (always has 3 articles) ===
- assertVisible:
    text: ".*FEATURED.*"
- assertVisible:
    text: ".*min read.*"
- takeScreenshot: "library_01_browse"

# === BROWSE BY SECTION ===
- assertVisible:
    text: ".*BROWSE BY.*"

# Scroll to see category cards
- swipe:
    direction: UP
    duration: 300
- takeScreenshot: "library_02_scrolled"

# Category names must be visible after scroll
- assertVisible:
    text: ".*Nature of Awareness.*"
- assertVisible:
    text: ".*Self-Inquiry.*"

# === ARTICLE READER (tap featured article) ===
# Scroll back up to reach featured cards
- swipe:
    direction: DOWN
    duration: 300
- tapOn:
    text: ".*min read.*"
- waitForAnimationToEnd
- takeScreenshot: "library_03_article_open"

# Article reader must show content
- assertVisible:
    text: ".*min read.*"

# Scroll within article
- swipe:
    direction: UP
    duration: 300
- takeScreenshot: "library_04_article_content"

# Go back to library
- back
- waitForAnimationToEnd

# === CATEGORY DETAIL ===
# Scroll down to category cards and tap one
- swipe:
    direction: UP
    duration: 300
- tapOn:
    text: ".*Nature of Awareness.*"
- waitForAnimationToEnd
- takeScreenshot: "library_05_category_detail"

# Verify category screen loaded with content
- assertVisible:
    text: ".*Nature of Awareness.*"
- assertVisible:
    text: ".*articles.*"

# Go back to library
- back
- waitForAnimationToEnd

# Return to home
- tapOn:
    text: "Home tab.*"
- assertVisible:
    text: ".*Next.*"
- takeScreenshot: "library_06_complete"
