# Library Content Flow - Browse articles and teachings
# Run: maestro test maestro/flows/09_library_content.yaml
#
# Tests: Library navigation, article browsing, content verification
# All content is free (no premium gating)

appId: com.dailypointer
---
- launchApp:
    clearState: true

# Complete onboarding
- runFlow: ../shared/skip_onboarding.yaml

# === NAVIGATE TO LIBRARY ===
- tapOn:
    text: "Library tab.*"
- waitForAnimationToEnd
- assertVisible:
    text: "Library"
- takeScreenshot: "maestro/screenshots/library_01_browse"

# Scroll until browse controls are in view
- scrollUntilVisible:
    element:
      text: "Topics"
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: ".*BROWSE BY.*"
    optional: true
- takeScreenshot: "maestro/screenshots/library_02_scrolled"
- takeScreenshot: "maestro/screenshots/library_03_browse_by"

# === PREMIUM REGRESSION GUARD ===
# All content is free — premium gating removed
- assertNotVisible:
    text: ".*Unlock.*"
- assertNotVisible:
    text: ".*Premium.*"
- takeScreenshot: "maestro/screenshots/library_04_no_premium"

# === RETURN TO HOME ===
- tapOn:
    text: "Home tab.*"
- assertVisible:
    text: "Save to favorites"
- takeScreenshot: "maestro/screenshots/library_05_complete"
