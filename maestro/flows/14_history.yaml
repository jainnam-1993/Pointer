# History Screen Flow - View past pointings
# Run: maestro test maestro/flows/14_history.yaml
#
# Tests: History screen navigation, past pointing list, revisit pointing
# Route: /history (accessible from Settings)

appId: com.dailypointer
---
- launchApp:
    clearState: true

# Complete onboarding
- runFlow: ../shared/skip_onboarding.yaml

# === VIEW SOME POINTINGS FIRST ===
# Navigate through a few pointings to populate history
- tapOn:
    text: "Home tab.*"
- tapOn:
    text: ".*Next.*"
- tapOn:
    text: ".*Next.*"
- tapOn:
    text: ".*Next.*"
- takeScreenshot: "maestro/screenshots/history_01_after_viewing"

# === NAVIGATE TO SETTINGS ===
- tapOn:
    text: "Settings tab.*"
- assertVisible:
    text: "Settings"
- takeScreenshot: "maestro/screenshots/history_02_settings"

# === OPEN HISTORY SCREEN ===
- scrollUntilVisible:
    element:
      text: "Past Pointings"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 10
    centerElement: true
    waitToSettleTimeoutMs: 500
- tapOn:
    text: "Past Pointings"
- takeScreenshot: "maestro/screenshots/history_03_screen"

# Verify history screen loaded
- assertVisible:
    text: "Past Pointings"

# === BROWSE HISTORY LIST ===
# Scroll through history
- swipe:
    direction: UP
    duration: 300
- takeScreenshot: "maestro/screenshots/history_04_scrolled"

# === TAP TO REVISIT POINTING ===
# Tap on a pointing in the history list
- tapOn:
    point: "50%,30%"
- takeScreenshot: "maestro/screenshots/history_05_revisit"

# === RETURN TO SETTINGS ===
- back:
- takeScreenshot: "maestro/screenshots/history_06_back_settings"

# === FINAL STATE ===
- tapOn:
    text: "Home tab.*"
- assertVisible:
    text: ".*Next.*"
- takeScreenshot: "maestro/screenshots/history_07_complete"
