# Library Rotation Flow - Test teaching view tracking and rotation
# Run: maestro test maestro/flows/19_library_rotation.yaml
#
# Tests: Teaching view tracking, visual state changes, list reordering
# Feature: Tapped teachings get marked as viewed (0.7 opacity) and sink
#          to bottom of list on subsequent visits
#
# Note: Opacity changes visible in screenshots but not programmatically verifiable
# This flow captures the user journey for visual regression testing

appId: com.dailypointer
---
- launchApp:
    clearState: true

# Complete onboarding
- runFlow: ../shared/skip_onboarding.yaml

# Navigate to Library tab
- tapOn:
    text: "Library tab.*"
- assertVisible:
    text: "Library"
- takeScreenshot: "maestro/screenshots/rotation_01_library_home"

# === BROWSE BY TEACHERS ===
- scrollUntilVisible:
    element:
      text: "Topics"
    direction: DOWN
    timeout: 10000
- tapOn:
    text: "Topics"
- tapOn:
    text: "Teachers"
- takeScreenshot: "maestro/screenshots/rotation_02_teachers_list"

# === TEST LINEAGES BROWSE MODE ===
- tapOn:
    text: "Teachers"
- tapOn:
    text: "Lineages"
- takeScreenshot: "maestro/screenshots/rotation_08_lineages_list"

# Tap into one lineage if available
- tapOn:
    text: ".*Advaita.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: "maestro/screenshots/rotation_09_lineage_teachings"

# Tap a teaching in this list
- swipe:
    direction: UP
    duration: 300
- tapOn:
    text: ".*tradition.*"
    index: 0
    optional: true
- takeScreenshot: "maestro/screenshots/rotation_10_lineage_tap"

# === RETURN TO HOME ===
- tapOn:
    text: "Home tab.*"
- assertVisible:
    text: ".*Next.*"
- takeScreenshot: "maestro/screenshots/rotation_11_complete"
