# Notification Configuration Flow - Presets, time windows, frequency
# Run: maestro test maestro/flows/18_notification_config.yaml
#
# Tests: Notification settings, presets, time windows, test notification
# Presets: Morning, All day, Evening, Minimal, Test (developer)
# Config: Start/end time, frequency (30min - 12hrs), quiet hours
#
# Note: Android 12+ requires exact alarm permission for notifications

appId: com.dailypointer
---
- launchApp:
    clearState: true

# Complete onboarding
- runFlow: ../shared/skip_onboarding.yaml

# === NAVIGATE TO SETTINGS ===
- tapOn:
    text: "Settings tab.*"
- assertVisible:
    text: "Settings"
- takeScreenshot: "maestro/screenshots/notif_01_settings"

# === OPEN NOTIFICATION SETTINGS ===
- tapOn:
    text: ".*Notification Times.*"
- takeScreenshot: "maestro/screenshots/notif_02_notification_settings"

# Verify notification settings opened
- assertVisible:
    text: "Notification Schedule"

# === NOTIFICATION TOGGLE ===
# Toggle notifications on/off
- tapOn:
    text: "Morning"
    optional: true
- takeScreenshot: "maestro/screenshots/notif_03_toggled"

# === PRESET: MORNING ===
- tapOn:
    text: "Morning"
    optional: true
- takeScreenshot: "maestro/screenshots/notif_04_morning_preset"

# === PRESET: ALL DAY ===
- tapOn:
    text: "All Day"
    optional: true
- takeScreenshot: "maestro/screenshots/notif_05_all_day_preset"

# === PRESET: EVENING ===
- tapOn:
    text: "Evening"
    optional: true
- takeScreenshot: "maestro/screenshots/notif_06_evening_preset"

# === PRESET: MINIMAL ===
- tapOn:
    text: "Minimal"
    optional: true
- takeScreenshot: "maestro/screenshots/notif_07_minimal_preset"

# === CUSTOM CONFIGURATION ===
# Scroll to see more options
- swipe:
    direction: UP
    duration: 300
- takeScreenshot: "maestro/screenshots/notif_08_more_options"

# === TIME WINDOW ===
# Tap to configure start time
- tapOn:
    text: "Start"
    optional: true
- takeScreenshot: "maestro/screenshots/notif_09_start_time"

# Save/close picker if opened
- tapOn:
    text: "Done"
    optional: true

# Tap to configure end time
- tapOn:
    text: "End"
    optional: true
- takeScreenshot: "maestro/screenshots/notif_10_end_time"

# Save/close picker if opened
- tapOn:
    text: "Done"
    optional: true

# === FREQUENCY ===
- tapOn:
    text: "Frequency"
    optional: true
- tapOn:
    text: "1h"
    optional: true
- takeScreenshot: "maestro/screenshots/notif_11_frequency"

# === CLOSE SHEET ===
- tapOn:
    text: "Done"
    optional: true
- takeScreenshot: "maestro/screenshots/notif_12_quiet_hours"

# === BACK TO SETTINGS ===
- pressKey: Home
- launchApp
- takeScreenshot: "maestro/screenshots/notif_13_back_settings"

# === FINAL STATE ===
- tapOn:
    text: "Home tab.*"
- assertVisible:
    text: ".*Next.*"
- takeScreenshot: "maestro/screenshots/notif_14_complete"
