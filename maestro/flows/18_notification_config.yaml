# Notification Configuration Flow - Presets, time windows, frequency
# Run: maestro test maestro/flows/18_notification_config.yaml
#
# Tests: Notification settings, presets, time windows, frequency
# Presets: Morning, All day, Evening, Minimal
# Config: Start/end time, frequency (30min - 12hrs)

appId: com.dailypointer
---
- launchApp:
    clearState: true

# Complete onboarding
- runFlow: ../shared/skip_onboarding.yaml

# === NAVIGATE TO SETTINGS ===
- tapOn:
    text: "Settings tab.*"
- assertVisible:
    text: ".*Settings.*"
- takeScreenshot: "notif_01_settings"

# === OPEN NOTIFICATION SETTINGS ===
- tapOn:
    text: ".*Notification.*"
- takeScreenshot: "notif_02_notification_settings"

# Verify notification settings opened
- assertVisible:
    text: ".*Notification.*"

# === NOTIFICATION TOGGLE ===
- tapOn:
    text: ".*Enable.*"
- takeScreenshot: "notif_03_toggled"

# === PRESET: MORNING ===
- tapOn:
    text: ".*Morning.*"
- takeScreenshot: "notif_04_morning_preset"

# === PRESET: ALL DAY ===
- tapOn:
    text: ".*All.*day.*"
- takeScreenshot: "notif_05_all_day_preset"

# === PRESET: EVENING ===
- tapOn:
    text: ".*Evening.*"
- takeScreenshot: "notif_06_evening_preset"

# === PRESET: MINIMAL ===
- tapOn:
    text: ".*Minimal.*"
- takeScreenshot: "notif_07_minimal_preset"

# === CUSTOM CONFIGURATION ===
- swipe:
    direction: UP
    duration: 300
- takeScreenshot: "notif_08_more_options"

# === TIME WINDOW ===
- tapOn:
    text: ".*Start.*"
- takeScreenshot: "notif_09_start_time"

# Close time picker
- tapOn:
    text: ".*OK.*"

# Configure end time
- tapOn:
    text: ".*End.*"
- takeScreenshot: "notif_10_end_time"

# Close time picker
- tapOn:
    text: ".*OK.*"

# === FREQUENCY ===
- tapOn:
    text: ".*Frequency.*"
- tapOn:
    text: ".*hour.*"
- takeScreenshot: "notif_11_frequency"

# === QUIET HOURS ===
- tapOn:
    text: ".*Quiet.*"
- takeScreenshot: "notif_12_quiet_hours"

# === BACK TO SETTINGS ===
- back
- tapOn:
    text: "Settings tab.*"
- takeScreenshot: "notif_13_back_settings"

# === FINAL STATE ===
- tapOn:
    text: "Home tab.*"
- assertVisible:
    text: ".*Next.*"
- takeScreenshot: "notif_14_complete"
